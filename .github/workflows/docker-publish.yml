name: Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual rebuild without cutting a release. Use this to republish the image
  # from the current tree (e.g. after a sync that only changed source/docs).
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to publish, e.g. 2.0.1 (":latest" also moves unless it has a pre-release suffix like -beta).'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nebulis-app/nebulis:${{ steps.version.outputs.version }}
            ${{ !contains(steps.version.outputs.version, '-') && 'ghcr.io/nebulis-app/nebulis:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
