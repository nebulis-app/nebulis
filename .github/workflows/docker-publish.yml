name: Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual rebuild without cutting a release. Use this to republish the image
  # from the current tree (e.g. after a sync that only changed source/docs).
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to publish, e.g. 2.0.1 (":latest" also moves unless it has a pre-release suffix like -beta).'
        required: true
        type: string

env:
  IMAGE: ghcr.io/nebulis-app/nebulis

jobs:
  # Each architecture builds on a runner of its own kind, so nothing runs under QEMU
  # (the emulated arm64 build hung for six hours on v2.2.0-beta). Each job pushes its
  # image by digest only; the merge job below turns the two into one multi-arch tag.
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # A normal run takes well under 30 minutes; fail fast instead of burning six hours on a hang.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish multi-arch tag
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push the manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Both architectures must be present, or a user on the missing one would get a broken pull.
          test "$(ls | wc -l)" -eq 2 || { echo "expected 2 digests (amd64, arm64), found: $(ls)"; exit 1; }
          tags="-t ${IMAGE}:${VERSION}"
          # :latest never moves for a pre-release such as 2.2.0-beta.
          case "$VERSION" in
            *-*) ;;
            *) tags="$tags -t ${IMAGE}:latest" ;;
          esac
          docker buildx imagetools create $tags $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect the result
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
